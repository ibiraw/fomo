# limit website — static Next.js export served behind the Cloudflare Tunnel (Reborn1987)
# /policies → policies.html; hashed assets under /_next are cached for a year.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The link-preview image has no file extension.
  location = /opengraph-image {
    default_type image/png;
    try_files $uri =404;
  }

  # The extension download: never stored by Cloudflare or browsers, so an update is live the moment it is uploaded.
  location = /limit.zip {
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="limit.zip"' always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
