# limit website — static Next.js export served behind the Cloudflare Tunnel (Reborn1987)
# /policies → policies.html; hashed assets under /_next are cached for a year.
# Extension downloads, read by the server to tell the owner (backend DownloadWatcher). Time, method, status, bytes and
# Cloudflare's approximate location (country; region and city once Cloudflare's "Add visitor location headers" is on):
# no IP addresses. Fields are separated by "|" because city names contain spaces.
log_format limit_downloads '$time_iso8601|$request_method|$status|$body_bytes_sent|$http_cf_ipcountry|$http_cf_region|$http_cf_ipcity';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The link-preview image has no file extension.
  location = /opengraph-image {
    default_type image/png;
    try_files $uri =404;
  }

  # The extension download: never stored by Cloudflare or browsers, so an update is live the moment it is uploaded.
  location = /limit.zip {
    access_log /var/log/limit/downloads.log limit_downloads;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'attachment; filename="limit.zip"' always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
